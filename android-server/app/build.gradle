plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aipc.gamepadbridge'
    compileSdk 37

    defaultConfig {
        applicationId "com.aipc.gamepadbridge"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
